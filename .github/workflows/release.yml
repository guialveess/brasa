name: Release

# Builds Brasa for macOS (Apple Silicon) and Windows (x86_64) when a version tag is pushed, and
# attaches the packages plus the in-app updater's manifest (latest.json) to the GitHub release of
# that tag.
#
# Windows ships as a portable zip, not an installer: the in-app updater only offers a silent
# update to an Inno Setup install (telaio-update's install.rs), which this project does not build
# yet, so "windows-x86_64" is left out of latest.json on purpose (a missing platform there just
# means no update is offered for it, not an error). Updating on Windows today means re-running
# the install script. Linux packaging can be added the same way later, following Postino's own
# release.yml (this project's git history, on the `upstream` remote of a clone that still has it)
# as a reference.
#
# The release is created as a draft here and published once every asset is uploaded, so a failed
# build never leaves a broken release visible.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      # The tag must be `v` plus the workspace version, optionally followed by a pre-release
      # suffix (`v0.1.0-rc.1` for version 0.1.0). Tags with a suffix become pre-releases.
      - name: Compare the tag with the workspace version
        id: version
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          base="${version%%-*}"
          cargo_version=$(awk -F'"' '
            /^\[workspace\.package\]/ { section = 1; next }
            /^\[/ { section = 0 }
            section && /^version *=/ { print $2; exit }
          ' Cargo.toml)
          if [ "$base" != "$cargo_version" ] && [ "$version" != "$cargo_version" ]; then
            echo "::error::Tag $tag does not match the workspace version $cargo_version"
            exit 1
          fi
          if [ "$version" != "$base" ]; then prerelease=true; else prerelease=false; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Version $version, pre-release: $prerelease"

  build-macos:
    name: Build macOS
    needs: check
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      # BRASA_UPDATER=github is the compile-time flag that turns on the in-app updater
      # (telaio_update::updater_enabled, vendored at vendor/telaio): unset, every build (this
      # workflow included, until now) looks like a dev build and the About screen always shows
      # "Updates are not available in this build" (#241), even for a copy downloaded from a
      # release.
      - name: Build
        env:
          BRASA_UPDATER: github
        run: cargo build --release --locked --target aarch64-apple-darwin

      - name: Package Brasa.app
        run: |
          mkdir -p dist
          packaging/macos/bundle.sh "$VERSION" \
            target/aarch64-apple-darwin/release/brasa dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: brasa-macos-arm64
          path: dist/*
          if-no-files-found: error

  build-windows:
    name: Build Windows
    needs: check
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build
        env:
          BRASA_UPDATER: github
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      # No installer yet (see the workflow's own doc comment): a portable zip, entries at the top
      # level, matching what install.ps1 expects.
      - name: Package the portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zip = Join-Path $PWD "dist\Brasa-$env:VERSION-windows-x86_64-portable.zip"
          Compress-Archive -Force -DestinationPath $zip -Path `
            "target\x86_64-pc-windows-msvc\release\brasa.exe", "LICENSE", "NOTICE"
          Get-Item $zip | Format-List Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: brasa-windows-x86_64
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [check, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      PRERELEASE: ${{ needs.check.outputs.prerelease }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # The manifest the in-app updater reads (telaio-update, vendored at vendor/telaio). A
      # platform missing from `platforms` just means that platform has no update offered yet
      # (telaio_update::check's own doc comment), so it is fine to publish with macOS alone.
      - name: Write latest.json
        working-directory: dist
        run: |
          version="${TAG#v}"
          base="https://github.com/$GH_REPO/releases/download/$TAG"
          mac=$(ls Brasa-*-macos-arm64.app.tar.gz 2>/dev/null | head -n 1)
          win=$(ls Brasa-*-windows-x86_64-portable.zip 2>/dev/null | head -n 1)
          if [ -z "$mac" ] || [ -z "$win" ]; then
            echo "::error::Missing the macOS app archive or the Windows portable zip in dist"
            exit 1
          fi
          jq -n \
            --arg version "$version" \
            --arg notes_url "https://github.com/$GH_REPO/releases/tag/$TAG" \
            --arg mac_url "$base/$mac" --arg mac_sha "$(sha256sum "$mac" | cut -d' ' -f1)" \
            '{
              version: $version,
              notes_url: $notes_url,
              platforms: {
                "macos-aarch64": { url: $mac_url, sha256: $mac_sha }
              }
            }' > latest.json
          cat latest.json

      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      # `gh release view` also finds draft releases by their tag.
      - name: Create the draft release if missing
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --title "$TAG" \
              --notes "Release notes for $TAG are pending."
          fi

      - name: Upload assets
        run: gh release upload "$TAG" dist/* --clobber

      - name: Publish
        run: |
          if [ "$PRERELEASE" = true ]; then
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release edit "$TAG" --draft=false --prerelease=false --latest
          fi
